# Machine-readable licensing for every file (https://reuse.software).
# Check with: reuse lint
version = 1
SPDX-PackageName = "YAiST"
SPDX-PackageSupplier = "The YAiST contributors"

# Everything is YAiST's own work under Apache-2.0 unless a more
# specific entry below says otherwise.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The YAiST contributors"
SPDX-License-Identifier = "Apache-2.0"

# Adapted from the ArtCraft launcher (https://github.com/storytold/craft-launcher),
# MIT OR Apache-2.0, used under Apache-2.0. Only code and visual structure; no
# ArtCraft trademarks.
[[annotations]]
path = ["apps/yaist-gui/src/theme.rs", "apps/yaist-gui/src/widgets.rs"]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2026 ArtCraft Team and the ArtCraft Launcher contributors", "2026 The YAiST contributors"]
SPDX-License-Identifier = "Apache-2.0"

# The YAiST icon (aardvark at a laptop), generated with ChatGPT (OpenAI) by
# Lubos Kocman and traced to SVG in Inkscape; the PNG sizes are rendered from
# the SVG. OpenAI's terms assign the output to the user. Purely
# AI-generated images may not be protected by copyright in some
# jurisdictions; whatever rights exist are licensed under Apache-2.0.
[[annotations]]
path = "assets/icons/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Lubos Kocman"
SPDX-License-Identifier = "Apache-2.0"

# SLES product description used by the SLE migration, from
# opensuse-migration-tool (Apache-2.0).
[[annotations]]
path = "assets/migration/SLES.prod"
precedence = "override"
SPDX-FileCopyrightText = "opensuse-migration-tool contributors (https://github.com/openSUSE/opensuse-migration-tool)"
SPDX-License-Identifier = "Apache-2.0"

# The welcome screen's pirate Geeko, from openSUSE-welcome. A separate data
# file loaded at run time, never compiled into the binaries.
[[annotations]]
path = "assets/art/sinking.svg"
precedence = "override"
SPDX-FileCopyrightText = "openSUSE-welcome contributors (https://github.com/openSUSE/openSUSE-welcome)"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = ["assets/fonts/Inter-Variable.ttf", "assets/fonts/OFL-Inter.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2016 The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["assets/fonts/Archivo-Variable.ttf", "assets/fonts/OFL-Archivo.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2020 The Archivo Project Authors (https://github.com/Omnibus-Type/Archivo)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["assets/fonts/GeistMono-Variable.ttf", "assets/fonts/OFL-GeistMono.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2024 The Geist Project Authors (https://github.com/vercel/geist-font)"
SPDX-License-Identifier = "OFL-1.1"

# The openSUSE Handbook: text under CC-BY-SA-4.0, so chapters can be reused in
# other openSUSE documentation with credit, and what is built on them stays
# open too.
[[annotations]]
path = "docs/handbook/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 The YAiST contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"
